version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: taxi_service_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taxi_service_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxi_service_app
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: taxi_service_db
      JWT_SECRET: supersecret_production_jwt_key_98765
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db_data:
